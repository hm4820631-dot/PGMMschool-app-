<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PGMM - Pransagar Girl's Model Mission (H.S)</title>
<link rel="icon" href="IMG_2591.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--navy:#12295c;--gold:#c9a24b;--sky:#4aa8e8;--pink:#e8588d;--green:#22a06b;--orange:#f2994a;--bg:#eef6fd;--ink:#1b2540}
*{box-sizing:border-box}body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.hero{background:linear-gradient(rgba(18,41,92,.55),rgba(18,41,92,.85)),url(IMG_2592.jpeg) center/cover;color:#fff;text-align:center;padding:22px 16px 30px}
.hero img{width:78px;height:78px;border-radius:50%;border:3px solid var(--gold)}
.hero h1{margin:8px 0 2px;font-size:22px}.hero p{margin:0;color:#f1dca0}
.box{background:#fff;border-radius:16px;padding:18px;margin:14px auto;max-width:960px;box-shadow:0 4px 18px rgba(18,41,92,.1)}
.login{max-width:380px;margin-top:-18px;position:relative}
input,select{width:100%;padding:11px;border:1.5px solid #cfe0f1;border-radius:10px;font:inherit;margin:5px 0}
button{background:var(--navy);color:#fff;border:0;padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
button.s{background:var(--sky)}button.g{background:var(--green)}button.r{background:var(--pink)}button.o{background:var(--orange)}
button.sm{padding:5px 10px;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--navy);position:sticky;top:0;z-index:5}
nav button{background:#ffffff1a;white-space:nowrap}nav button.on{background:var(--gold);color:var(--navy)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#fff;border-bottom:3px solid var(--gold)}
.top b{color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:#dcecfb;text-align:left;cursor:pointer}
th,td{padding:8px;border-bottom:1px solid #e3edf7}.wrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border-radius:14px;padding:14px;color:#fff;font-weight:600}.stat span{display:block;font-size:26px}
.bar{height:12px;background:#dcecfb;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal .box{width:100%;max-width:440px;max-height:90vh;overflow:auto}
.tag{padding:2px 8px;border-radius:20px;font-size:12px;color:#fff}.hide{display:none}.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--sky);border:2px solid var(--gold);vertical-align:middle}
h2{color:var(--navy);margin:4px 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
</style></head><body>
<div id="app"></div>
<script>
// ====== 1) PUT YOUR SUPABASE VALUES HERE (Project Settings > API) ======
const SUPABASE_URL='https://jbdeqrjpsvesxdgnibch.supabase.co', SUPABASE_KEY='sb_publishable_E1VkT-j_x0ju_t48EQnpSA_eEkNLjJs';
// =======================================================================
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), A=$('#app'), mail=id=>id.trim().toLowerCase()+'@pgmm.school';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ym=()=>new Date().toISOString().slice(0,7);
let me=null, tab='students', cache={}, sortKey={};

const hero=()=>`<div class="hero"><img src="IMG_2591.jpeg"><h1>Pransagar Girl's Model Mission (H.S)</h1><p>P.G.M.M · Estd 2024 · Education Builds a Brighter Future</p></div>`;

function loginView(msg=''){A.innerHTML=hero()+`<div class="box login"><h2>Login</h2>
<input id="lid" placeholder="Your ID" autocapitalize="none"><input id="pw" type="password" placeholder="Password">
<p style="color:#c0392b;margin:4px 0">${msg}</p><button style="width:100%" onclick="login()">Login</button></div>`}
async function login(){
  const {error}=await db.auth.signInWithPassword({email:mail($('#lid').value),password:$('#pw').value});
  if(error)return loginView('Wrong ID or password'); boot()}
async function logout(){await db.auth.signOut();me=null;loginView()}
async function boot(){
  const {data:{user}}=await db.auth.getUser(); if(!user)return loginView();
  const {data:p}=await db.from('profiles').select('*').eq('id',user.id).single();
  if(!p){await db.auth.signOut();return loginView('Account not set up. Contact admin.')}
  me=p; ({admin:adminView,teacher:teacherView,student:studentView})[p.role]()}
const shell=(nav,body)=>A.innerHTML=`<div class="top"><div><img src="IMG_2591.jpeg" width="30" style="vertical-align:middle;border-radius:50%"> <b>PGMM</b> · ${esc(me.name)} (${me.role})</div><button class="r sm" onclick="logout()">Logout</button></div>${nav}<div id="main" style="padding:4px 10px">${body}</div>`;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const pct=(m,f)=>f?Math.round(m*100/f):0;
const av=(u,n,sz=40)=>u?`<img class="av" src="${esc(u)}" style="width:${sz}px;height:${sz}px">`:`<span class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz/2.2)}px">${esc((n||'?')[0].toUpperCase())}</span>`;
const teachersBox=d=>`<div class="box"><h2>Our teachers</h2><div class="grid">${(d||[]).map(t=>`<div style="text-align:center">${av(t.photo_url,t.name,72)}<br><b>${esc(t.name)}</b><br><small>${esc(t.subject)}</small></div>`).join('')||'No teachers yet.'}</div></div>`;
function shrink(file,size=256){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,size,size);c.toBlob(b=>b?ok(b):no(new Error('Image error')),'image/jpeg',.85)};im.onerror=()=>no(new Error('Cannot read this image'));im.src=URL.createObjectURL(file)})}
async function upPhoto(file,id){const b=await shrink(file);const p=`teachers/${id}_${Date.now()}.jpg`;const {error}=await db.storage.from('photos').upload(p,b,{contentType:'image/jpeg'});if(error)throw error;return db.storage.from('photos').getPublicUrl(p).data.publicUrl}
async function myPhoto(f,id){if(!f)return;try{const u=await upPhoto(f,id);const {error}=await db.rpc('set_my_photo',{url:u});if(error)throw error;teacherView()}catch(e){alert(e.message)}}

// ---------------- STUDENT ----------------
async function studentView(){
  const {data:s}=await db.from('students').select('*').eq('user_id',me.id).single();
  const {data:f}=await db.from('fees').select('*').eq('student',s.id).order('month',{ascending:false});
  const {data:r}=await db.from('results').select('*').eq('student',s.id).order('created_at');
  const {data:td}=await db.from('teacher_directory').select('*').order('name');
  const due=(f||[]).reduce((a,x)=>a+x.amount-x.paid,0);
  const ex={};(r||[]).forEach(x=>{(ex[x.exam]??={m:0,f:0}).m+=x.marks;ex[x.exam].f+=x.full_marks});
  shell('',`<div class="box"><h2>${esc(s.name)}</h2><div class="grid">
   <div class="stat" style="background:var(--sky)">Class<span>${esc(s.class)}</span></div>
   <div class="stat" style="background:var(--pink)">Roll<span>${esc(s.roll)}</span></div>
   <div class="stat" style="background:${due?'var(--orange)':'var(--green)'}">Fees due<span>${money(due)}</span></div></div>
   <p><b>ID:</b> ${esc(s.student_id)}<br><b>Address:</b> ${esc(s.address)}<br><b>Contact:</b> ${esc(s.contact)}<br>
   <b>Guardian:</b> ${esc(s.guardian_name)} · ${esc(s.guardian_phone)}</p></div>
   <div class="box"><h2>Result progress</h2>${Object.entries(ex).map(([k,v])=>`<p>${esc(k)}: <b>${pct(v.m,v.f)}%</b><div class="bar"><i style="width:${pct(v.m,v.f)}%"></i></div></p>`).join('')||'No results yet.'}
   <div class="wrap"><table><tr><th>Exam<th>Subject<th>Marks</tr>${(r||[]).map(x=>`<tr><td>${esc(x.exam)}<td>${esc(x.subject)}<td>${x.marks}/${x.full_marks}`).join('')}</table></div></div>
   <div class="box"><h2>Fees</h2><div class="wrap"><table><tr><th>Month<th>Amount<th>Paid<th>Due</tr>${(f||[]).map(x=>`<tr><td>${x.month}<td>${money(x.amount)}<td>${money(x.paid)}<td style="color:${x.amount>x.paid?'#c0392b':'#22a06b'}">${money(x.amount-x.paid)}`).join('')}</table></div></div>`+teachersBox(td))}

// ---------------- TEACHER ----------------
async function teacherView(){
  const {data:t}=await db.from('teachers').select('*').eq('user_id',me.id).single();
  const {data:sal}=await db.from('salaries').select('*').eq('teacher',t.id).order('month',{ascending:false});
  const {data:att}=await db.from('attendance').select('*').eq('teacher',t.id).order('day',{ascending:false}).limit(31);
  const {data:st}=await db.from('students').select('id,name,class,roll,student_id').order('class').order('roll');
  cache.st=st;
  const {data:td}=await db.from('teacher_directory').select('*').order('name');
  shell('',`<div class="box"><div style="display:flex;gap:14px;align-items:center">${av(t.photo_url,t.name,84)}<div><h2 style="margin:0">${esc(t.name)}</h2><p style="margin:4px 0">${esc(t.subject)} · ${esc(t.phone)} · Salary ${money(t.monthly_salary)}/month</p><input type="file" accept="image/*" id="ph" class="hide" onchange="myPhoto(this.files[0],'${t.id}')"><button class="s sm" onclick="$('#ph').click()">Change photo</button></div></div></div>
  <div class="box"><h2>Upload result</h2>
   <input id="q" placeholder="Search student by name / class / roll" oninput="fillPick()"><select id="pick"></select>
   <div class="row"><input id="ex" placeholder="Exam (e.g. Unit Test 1)"><input id="sub" placeholder="Subject" value="${esc(t.subject)}"></div>
   <div class="row"><input id="mk" type="number" placeholder="Marks"><input id="fm" type="number" value="100" placeholder="Full marks"></div>
   <button class="g" onclick="saveResult()">Save result</button></div>
  <div class="box"><h2>Salary</h2><div class="wrap"><table><tr><th>Month<th>Amount<th>Status</tr>${(sal||[]).map(x=>`<tr><td>${x.month}<td>${money(x.amount)}<td>${x.status}`).join('')}</table></div></div>
  <div class="box"><h2>Attendance</h2><div class="wrap"><table><tr><th>Date<th>Status</tr>${(att||[]).map(x=>`<tr><td>${x.day}<td>${x.status}`).join('')}</table></div></div>`+teachersBox(td));fillPick()}
function fillPick(){const q=($('#q').value||'').toLowerCase();
  $('#pick').innerHTML=cache.st.filter(s=>(s.name+s.class+s.roll+s.student_id).toLowerCase().includes(q)).slice(0,60).map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.class)} · Roll ${esc(s.roll)}</option>`).join('')}
async function saveResult(){
  const row={student:$('#pick').value,exam:$('#ex').value,subject:$('#sub').value,marks:+$('#mk').value,full_marks:+$('#fm').value};
  if(!row.student||!row.exam||!row.subject||$('#mk').value==='')return alert('Fill all fields');
  const {error}=await db.from('results').insert(row);alert(error?error.message:'Saved');if(!error)$('#mk').value=''}

// ---------------- ADMIN ----------------
const TABS={
 students:{t:'Students',tbl:'students',cols:['student_id','name','class','roll','contact'],form:[['student_id','Student ID'],['name','Name'],['class','Class'],['roll','Roll'],['address','Address'],['guardian_name','Guardian name'],['guardian_phone','Guardian phone'],['contact','Contact number']],acct:1,role:'student'},
 teachers:{t:'Teachers',tbl:'teachers',cols:['photo_url','teacher_id','name','subject','phone','monthly_salary'],photo:1,form:[['teacher_id','Teacher ID'],['name','Name'],['subject','Subject'],['phone','Phone'],['monthly_salary','Monthly salary']],acct:1,role:'teacher'},
 fees:{t:'Fees',custom:'fees'},results:{t:'Results',tbl:'results',cols:['student_name','exam','subject','marks','full_marks'],form:[['exam','Exam'],['subject','Subject'],['marks','Marks'],['full_marks','Full marks']],student:1},
 salaries:{t:'Salary',tbl:'salaries',cols:['teacher_name','month','amount','status'],form:[['month','Month (YYYY-MM)'],['amount','Amount'],['status','Status (Paid/Due)']],teacher:1},
 attendance:{t:'Attendance',tbl:'attendance',cols:['teacher_name','day','status'],form:[['day','Date (YYYY-MM-DD)'],['status','Present / Absent / Leave']],teacher:1},
 admins:{t:'Admins',custom:'admins'}};
function adminView(){shell(`<nav>${Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';adminView()">${v.t}</button>`).join('')}</nav>`,'<div class="box" id="pane">Loading…</div>');loadTab()}
async function names(){const [s,t]=await Promise.all([db.from('students').select('id,name,class,roll'),db.from('teachers').select('id,name')]);
  cache.S=Object.fromEntries((s.data||[]).map(x=>[x.id,x]));cache.T=Object.fromEntries((t.data||[]).map(x=>[x.id,x]))}
async function loadTab(){
  const T=TABS[tab];await names();
  if(T.custom==='fees')return feesPane(); if(T.custom==='admins')return adminsPane();
  let {data}=await db.from(T.tbl).select('*').order('created_at',{ascending:false,nullsFirst:false});
  data=(data||[]).map(r=>({...r,student_name:cache.S[r.student]?.name,teacher_name:cache.T[r.teacher]?.name}));
  cache.rows=data;drawTable()}
function drawTable(){const T=TABS[tab],q=($('#sq')?.value||'').toLowerCase();let rows=cache.rows.filter(r=>JSON.stringify(Object.values(r)).toLowerCase().includes(q));
  const k=sortKey[tab];if(k)rows.sort((a,b)=>String(a[k.c]).localeCompare(String(b[k.c]),undefined,{numeric:true})*k.d);
  $('#pane').innerHTML=`<h2>${T.t} (${rows.length})</h2><div class="row"><input id="sq" placeholder="Search…" value="${esc(q)}" oninput="drawTable();this.focus()"><button class="g" style="flex:0" onclick="edit()">+ Add</button></div>
  <div class="wrap"><table><tr>${T.cols.map(c=>`<th onclick="srt('${c}')">${c==='photo_url'?'photo':c.replace('_',' ')}</th>`).join('')}<th></tr>
  ${rows.map(r=>`<tr>${T.cols.map(c=>`<td>${c==='photo_url'?av(r[c],r.name,34):esc(r[c])}`).join('')}<td style="white-space:nowrap"><button class="s sm" onclick="edit('${r.id}')">Edit</button> <button class="r sm" onclick="del('${r.id}')">Delete</button>`).join('')}</table></div>`;
  const e=$('#sq');if(q){e.focus();e.setSelectionRange(q.length,q.length)}}
function srt(c){const k=sortKey[tab];sortKey[tab]={c,d:k&&k.c==c?-k.d:1};drawTable()}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box">${html}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};document.body.appendChild(m);return m}
function edit(id){const T=TABS[tab],r=cache.rows.find(x=>x.id==id)||{};
  const pick=(key,list,label)=>`<label>${label}</label><select id="f_${key}">${Object.values(list).map(x=>`<option value="${x.id}" ${r[key]==x.id?'selected':''}>${esc(x.name)}${x.class?' · '+esc(x.class)+' · '+esc(x.roll):''}</option>`).join('')}</select>`;
  modal(`<h2>${id?'Edit':'Add'} ${T.t}</h2>${T.student?pick('student',cache.S,'Student'):''}${T.teacher?pick('teacher',cache.T,'Teacher'):''}
  ${T.form.map(([k,l])=>`<label>${l}</label><input id="f_${k}" value="${esc(r[k])}">`).join('')}
  ${T.photo?`<label>Photo</label><input type="file" id="f_photo" accept="image/*">`:''}
  ${T.acct&&!id?`<label>Login password (min 6 chars)</label><input id="f_pw" value="${Math.random().toString(36).slice(2,8)}"><small>Login ID = ${T.form[0][1]}</small>`:''}
  <p></p><button class="g" onclick="save('${id||''}',this)">Save</button>`)}
async function mkUser(loginId,pw,role,name){
  const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const {data,error}=await tmp.auth.signUp({email:mail(loginId),password:pw});if(error)throw error;
  const {error:e2}=await db.from('profiles').insert({id:data.user.id,login_id:loginId.trim().toLowerCase(),role,name});if(e2)throw e2;return data.user.id}
async function save(id,btn){const T=TABS[tab];btn.disabled=true;try{
  const row={};T.form.forEach(([k])=>row[k]=$('#f_'+k).value.trim());
  if(T.student)row.student=$('#f_student').value;if(T.teacher)row.teacher=$('#f_teacher').value;
  if(T.photo){const fl=$('#f_photo').files[0];if(fl)row.photo_url=await upPhoto(fl,id||'new')}
  if(T.acct&&!id){row.user_id=await mkUser(row[T.form[0][0]],$('#f_pw').value,T.role,row.name);alert('Account created.\nID: '+row[T.form[0][0]]+'\nPassword: '+$('#f_pw').value+'\n(Note it down and give it to them)')}
  const q=id?db.from(T.tbl).update(row).eq('id',id):db.from(T.tbl).insert(row);const {error}=await q;if(error)throw error;
  document.querySelector('.modal').remove();loadTab()}catch(e){alert(e.message);btn.disabled=false}}
async function del(id){if(!confirm('Delete permanently?'))return;const {error}=await db.from(TABS[tab].tbl).delete().eq('id',id);if(error)alert(error.message);loadTab()}

// fees
async function feesPane(){const m=window._fm||ym();window._fm=m;
  const {data}=await db.from('fees').select('*').eq('month',m);cache.fees=data||[];
  const st=Object.values(cache.S).sort((a,b)=>(a.class+a.roll).localeCompare(b.class+b.roll,undefined,{numeric:true}));
  const {data:sp}=await db.from('students').select('id,guardian_name,guardian_phone');const g=Object.fromEntries(sp.map(x=>[x.id,x]));
  $('#pane').innerHTML=`<h2>Fees</h2><div class="row"><input type="month" value="${m}" onchange="window._fm=this.value;feesPane()"><input id="amt" type="number" placeholder="Monthly fee for everyone" style="flex:2"><button class="s" onclick="genFees()">Create month</button><button class="r" onclick="delMonth()">Delete month</button></div>
  ${cache.cardsHtml=cache.fees.map(f=>{const s=cache.S[f.student]||{},d=f.amount-f.paid,p=g[f.student]||{};
   const txt=encodeURIComponent(`Dear ${p.guardian_name||'Guardian'}, ${s.name}'s school fee for ${m}: ${money(f.amount)}, paid ${money(f.paid)}, due ${money(d)}. - Pransagar Girl's Model Mission (H.S)`);
   const st=d>0?'Due '+money(d):(d<0?'Extra '+money(-d):'✓ Paid');
   return `<div style="border:1.5px solid #dcecfb;border-radius:12px;padding:10px;margin:8px 0">
    <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(s.name)} <small>${esc(s.class)}</small></b><b style="color:${d>0?'#c0392b':'#22a06b'}">${st}</b></div>
    <div class="row"><label><small>Amount</small><input type="number" value="${f.amount}" onchange="setFee('${f.id}','amount',this.value)"></label><label><small>Paid</small><input type="number" value="${f.paid}" onchange="setFee('${f.id}','paid',this.value)"></label></div>
    <div class="row" style="margin-top:6px">${d>0?`<a href="sms:${esc(p.guardian_phone)}?&body=${txt}"><button class="o sm" style="width:100%">SMS</button></a><a target="_blank" href="https://wa.me/91${String(p.guardian_phone||'').replace(/\D/g,'').slice(-10)}?text=${txt}"><button class="g sm" style="width:100%">WhatsApp</button></a>`:''}<button class="r sm" onclick="delFee('${f.id}')">Delete</button></div></div>`}).join('')||'<p>No fees for this month yet. Enter an amount and tap Create month.</p>'}
  ${cache.fees.length?`<button class="r sm" onclick="delMonth()">Delete whole month (${m})</button>`:''}
  <p><small>Tap SMS/WhatsApp to open a ready message to the guardian at month end.</small></p>`}
async function genFees(){const m=window._fm,a=+$('#amt').value;if(!a)return alert('Enter amount');
  const have=new Set(cache.fees.map(f=>f.student));const rows=Object.keys(cache.S).filter(id=>!have.has(id)).map(id=>({student:id,month:m,amount:a,paid:0}));
  if(!rows.length)return alert('Already created');const {error}=await db.from('fees').insert(rows);if(error)alert(error.message);feesPane()}
async function setPaid(id,v){const {error}=await db.from('fees').update({paid:+v}).eq('id',id);if(error)alert(error.message);feesPane()}
async function setFee(id,col,v){const {error}=await db.from('fees').update({[col]:+v}).eq('id',id);if(error)alert(error.message);feesPane()}
async function delFee(id){if(!confirm('Delete this fee entry?'))return;const {error}=await db.from('fees').delete().eq('id',id);if(error)alert(error.message);feesPane()}
async function delMonth(){if(!confirm('Delete ALL fee entries of '+window._fm+'?'))return;const {error}=await db.from('fees').delete().eq('month',window._fm);if(error)alert(error.message);feesPane()}
async function editFee(id,a){const v=prompt('New fee amount',a);if(v===null||v.trim()===''||isNaN(v))return;
  const {error}=await db.from('fees').update({amount:+v}).eq('id',id);if(error)alert(error.message);feesPane()}
async function delFee(id){if(!confirm('Delete this fee record?'))return;
  const {error}=await db.from('fees').delete().eq('id',id);if(error)alert(error.message);feesPane()}
async function delMonth(){const m=window._fm;if(!confirm('Delete ALL fee records of '+m+'?'))return;
  const {error}=await db.from('fees').delete().eq('month',m);if(error)alert(error.message);feesPane()}
// admins
async function adminsPane(){const {data}=await db.from('profiles').select('*').eq('role','admin');
  $('#pane').innerHTML=`<h2>Admins</h2><div class="wrap"><table><tr><th>ID<th>Name</tr>${data.map(a=>`<tr><td>${esc(a.login_id)}<td>${esc(a.name)}`).join('')}</table></div>
  <h2>Add admin</h2><input id="na" placeholder="Admin name"><input id="ni" placeholder="Login ID" autocapitalize="none"><input id="np" placeholder="Password (min 6)"><button class="g" onclick="addAdmin()">Create admin</button>`}
async function addAdmin(){try{await mkUser($('#ni').value,$('#np').value,'admin',$('#na').value);alert('Admin created');adminsPane()}catch(e){alert(e.message)}}
boot();
</script></body></html>
