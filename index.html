<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Admin</title><link rel="stylesheet" href="style.css">
</head><body><main>
<h1>School Admin <a href="portal.html">Student portal</a></h1>
<p id="status" class="card">Loading…</p>

<section id="login" class="card" hidden>
  <form id="loginForm">
    <input name="email" type="email" placeholder="Staff email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button class="add">Sign in</button>
  </form>
</section>

<section id="app" hidden>
  <nav>
    <button data-t="students">Students</button><button data-t="teachers">Teachers</button>
    <button data-t="fees">Fees</button><button data-t="exams">Exams</button>
  </nav>
  <div class="bar"><input id="search" placeholder="Search this list"><button id="logout" class="add">Sign out</button></div>
  <div class="card"><form id="form"></form></div>
  <div class="card wrap"><table id="table"></table></div>
</section>
</main>
<script>
var st = document.getElementById('status');
function showErr(m){ st.hidden = false; st.style.color = '#c92a2a'; st.textContent = 'Error: ' + m; }
window.addEventListener('error', function(e){ showErr(e.message || 'a script failed to load'); });
window.addEventListener('unhandledrejection', function(e){ showErr((e.reason && e.reason.message) || e.reason); });
var t = setInterval(function(){
  if (!document.getElementById('login').hidden || !document.getElementById('app').hidden) { st.hidden = true; clearInterval(t); }
}, 300);
setTimeout(function(){ if (!st.hidden && st.textContent === 'Loading…') st.textContent = 'Taking too long. A library may be blocked on your network.'; }, 10000);
</script>
<script type="module" src="admin.js" onerror="showErr('admin.js or a library could not load')"></script>
</body></html>
